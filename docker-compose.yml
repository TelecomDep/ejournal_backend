services:
  postgres:
    image: postgres:16-alpine
    container_name: ejournal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ejournal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ejournal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: golang:1.26.1-alpine
    container_name: ejournal-migrate
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc "/usr/local/go/bin/go install github.com/pressly/goose/v3/cmd/goose@latest &&
      /go/bin/goose -dir migrations postgres \"$$DB_DSN\" up"
    restart: "no"

  ejournal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ejournal-backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:9999}
      APP_PORT: ${APP_PORT:-8888}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:9999,http://127.0.0.1:9999,http://localhost:3000,http://127.0.0.1:3000}
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
      ROLE_HASH_TEACHER: ${ROLE_HASH_TEACHER:-TEACHER-HASH-2026}
      ROLE_HASH_STUDENT: ${ROLE_HASH_STUDENT:-STUDENT-HASH-2026}
      DEFAULT_STUDENT_GROUP_ID: ${DEFAULT_STUDENT_GROUP_ID:-1}
      ALLOW_EARLY_ATTENDANCE: ${ALLOW_EARLY_ATTENDANCE:-true}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@signal.qlabs.pro}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@signal.qlabs.pro}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8888}:${APP_PORT:-8888}"
    volumes:
      - avataruploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sibsutis_front
    environment:
      DOMAIN: ${DOMAIN:-lms.signal.qlabs.pro}
    depends_on:
      - ejournal-backend
    ports:
      - "${FRONTEND_PORT:-9999}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: ejournal-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  mailserver:
    image: mailserver/docker-mailserver:14.0.0
    container_name: mailserver
    hostname: signal
    domainname: qlabs.pro
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    environment:
      - ONE_DIR=1
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_AMAVIS=0
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  postgres-exporter:
    build:
      context: ./backend
      dockerfile: cmd/postgres-exporter/Dockerfile
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_DATA=/var/lib/grafana
      - GF_PATHS_HOME=/usr/share/grafana
      - GF_PATHS_CONFIG=/etc/grafana/grafana.ini
      - GF_PATHS_LOGS=/var/log/grafana
      - GF_PATHS_PLUGINS=/var/lib/grafana/plugins
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - PATH=/usr/share/grafana/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  init-azimutt-db:
    image: postgres:16-alpine
    container_name: ejournal-init-azimutt-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      sh -c "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'azimutt_db'\" | grep -q 1 || PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d postgres -c \"CREATE DATABASE azimutt_db;\";
             PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d azimutt_db -c \"CREATE OR REPLACE FUNCTION set_organization_plan() RETURNS trigger AS \\\$\\\$ BEGIN NEW.plan := 'enterprise'; RETURN NEW; END; \\\$\\\$ LANGUAGE plpgsql; DROP TRIGGER IF EXISTS trg_organization_plan ON organizations; CREATE TRIGGER trg_organization_plan BEFORE INSERT OR UPDATE ON organizations FOR EACH ROW EXECUTE FUNCTION set_organization_plan(); CREATE OR REPLACE FUNCTION auto_join_default_organization() RETURNS trigger AS \\\$\\\$ DECLARE target_org_id uuid; BEGIN SELECT id INTO target_org_id FROM organizations WHERE name = 'Sibsutis' LIMIT 1; IF target_org_id IS NULL THEN SELECT id INTO target_org_id FROM organizations ORDER BY created_at ASC LIMIT 1; END IF; IF target_org_id IS NOT NULL THEN INSERT INTO organization_members (user_id, organization_id, created_by, updated_by, created_at, updated_at, role) VALUES (NEW.id, target_org_id, NEW.id, NEW.id, NOW(), NOW(), 'writer') ON CONFLICT (user_id, organization_id) DO NOTHING; END IF; RETURN NEW; END; \\\$\\\$ LANGUAGE plpgsql; DROP TRIGGER IF EXISTS trg_auto_join_organization ON users; CREATE TRIGGER trg_auto_join_organization AFTER INSERT ON users FOR EACH ROW EXECUTE FUNCTION auto_join_default_organization();\" || true"
    restart: "no"

  azimutt:
    image: ghcr.io/azimuttapp/azimutt:main
    container_name: ejournal-azimutt
    environment:
      PORT: ${AZIMUTT_PORT:-4000}
      PHX_HOST: ${AZIMUTT_HOST:-localhost}
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${AZIMUTT_SECRET_KEY_BASE:-9z6W7qVn3B8m1K4pL0xR2sY5tU8vW1zX4yA7bC0dE3fG6hI9jK2lM5nO8pQ1rS4t}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/azimutt_db?sslmode=disable
      FILE_STORAGE_ADAPTER: local
      AUTH_PASSWORD: "true"
      PUBLIC_SITE: "false"
      SKIP_ONBOARDING: "true"
      GATEWAY_URL: "http://localhost:4177"
    ports:
      - "${AZIMUTT_PORT:-4000}:${AZIMUTT_PORT:-4000}"
    depends_on:
      postgres:
        condition: service_healthy
      init-azimutt-db:
        condition: service_completed_successfully
    restart: unless-stopped

  azimutt-gateway:
    image: node:20-alpine
    container_name: ejournal-azimutt-gateway
    working_dir: /app
    environment:
      NODE_PATH: "/usr/local/lib/node_modules"
    command: >
      sh -c "npm install -g @azimutt/gateway && node -e \"const g = require('/usr/local/lib/node_modules/@azimutt/gateway'); g.startServer(g.buildConfig({ NODE_ENV: 'production', LOG_LEVEL: 'info', API_HOST: '0.0.0.0', API_PORT: '4177', CORS_ALLOW_ORIGIN: '*' }));\""
    ports:
      - "4177:4177"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  avataruploads:
  mail-data:
  mail-state:
  mail-config:
  prometheus-data:
  grafana-data:
