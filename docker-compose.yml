services:
  postgres:
    image: postgres:16-alpine
    container_name: ejournal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ejournal}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ejournal}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: ejournal-migrate
    environment:
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "goose -dir migrations postgres \"$$DB_DSN\" up"]
    restart: "no"

  ejournal-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ejournal-backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SITE_BASE_URL: ${SITE_BASE_URL:-https://${DOMAIN:-lms.signal.qlabs.pro}}
      APP_PORT: ${APP_PORT:-8888}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-https://${DOMAIN:-lms.signal.qlabs.pro},http://localhost:8888,http://127.0.0.1:8888,http://localhost:3000,http://127.0.0.1:3000}
      DB_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
      ROLE_HASH_TEACHER: ${ROLE_HASH_TEACHER:-TEACHER-HASH-2026}
      ROLE_HASH_STUDENT: ${ROLE_HASH_STUDENT:-STUDENT-HASH-2026}
      DEFAULT_STUDENT_GROUP_ID: ${DEFAULT_STUDENT_GROUP_ID:-1}
      ALLOW_EARLY_ATTENDANCE: ${ALLOW_EARLY_ATTENDANCE:-true}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      SMTP_HOST: ${SMTP_HOST:-mailserver}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-noreply@signal.qlabs.pro}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM:-noreply@signal.qlabs.pro}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${APP_PORT:-8888}:${APP_PORT:-8888}"
    volumes:
      - avataruploads:/app/uploads
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sibsutis_front
    environment:
      DOMAIN: ${DOMAIN:-lms.signal.qlabs.pro}
    depends_on:
      - ejournal-backend
    ports:
      - "${FRONTEND_PORT:-9000}:80"
      - "${FRONTEND_HTTPS_PORT:-9001}:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot:ro
      - ./nginx_htpasswd:/etc/nginx/.htpasswd:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: ejournal-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot -q; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

  mailserver:
    image: mailserver/docker-mailserver:14.0.0
    container_name: mailserver
    hostname: signal
    domainname: qlabs.pro
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    environment:
      - ONE_DIR=1
      - ENABLE_SPAMASSASSIN=0
      - ENABLE_CLAMAV=0
      - ENABLE_AMAVIS=0
      - ENABLE_FAIL2BAN=1
      - SSL_TYPE=
    volumes:
      - mail-data:/var/mail
      - mail-state:/var/mail-state
      - mail-config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

  postgres-exporter:
    build:
      context: ./backend
      dockerfile: cmd/postgres-exporter/Dockerfile
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ejournal}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.external-url=https://${DOMAIN:-lms.signal.qlabs.pro}:${FRONTEND_HTTPS_PORT:-9001}/prometheus/'
      - '--web.route-prefix=/prometheus/'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.3.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_DOMAIN=${DOMAIN:-lms.signal.qlabs.pro}
      - GF_SERVER_ROOT_URL=https://${DOMAIN:-lms.signal.qlabs.pro}:${FRONTEND_HTTPS_PORT:-9001}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
  init-azimutt-db:
    image: postgres:16-alpine
    container_name: ejournal-init-azimutt-db
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      sh -c "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d postgres -tc \"SELECT 1 FROM pg_database WHERE datname = 'azimutt_db'\" | grep -q 1 || PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d postgres -c \"CREATE DATABASE azimutt_db;\""
    restart: "no"
  setup-azimutt-triggers:
    image: postgres:16-alpine
    container_name: ejournal-setup-azimutt-triggers
    depends_on:
      postgres:
        condition: service_healthy
      azimutt:
        condition: service_started
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command: >
      sh -c "until PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d azimutt_db -tc \"SELECT 1 FROM information_schema.tables WHERE table_name = 'users';\" | grep -q 1; do echo 'Waiting for Azimutt tables migration...'; sleep 3; done;
             PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h postgres -U \"$$POSTGRES_USER\" -d azimutt_db -c \"
             CREATE OR REPLACE FUNCTION set_organization_plan() RETURNS trigger AS \\\$\\\$ BEGIN NEW.plan := 'enterprise'; NEW.plan_status := 'active'; NEW.plan_seats := 100; IF NEW.plan_validated IS NULL THEN NEW.plan_validated := NOW(); END IF; RETURN NEW; END; \\\$\\\$ LANGUAGE plpgsql;
             DROP TRIGGER IF EXISTS trg_organization_plan ON organizations;
             CREATE TRIGGER trg_organization_plan BEFORE INSERT OR UPDATE ON organizations FOR EACH ROW EXECUTE FUNCTION set_organization_plan();
             CREATE OR REPLACE FUNCTION check_user_registration_permission() RETURNS trigger AS \\\$\\\$ BEGIN IF NEW.data IS NULL OR (NEW.data->>'created_by_admin') IS DISTINCT FROM 'true' THEN RAISE EXCEPTION 'Self-registration is disabled. Only administrators can create accounts.'; END IF; RETURN NEW; END; \\\$\\\$ LANGUAGE plpgsql;
             DROP TRIGGER IF EXISTS trg_block_self_registration ON users;
             CREATE TRIGGER trg_block_self_registration BEFORE INSERT ON users FOR EACH ROW EXECUTE FUNCTION check_user_registration_permission();
             CREATE OR REPLACE FUNCTION auto_join_default_organization() RETURNS trigger AS \\\$\\\$ DECLARE target_org_id uuid; BEGIN SELECT id INTO target_org_id FROM organizations WHERE name = 'Sibsutis' LIMIT 1; IF target_org_id IS NULL THEN SELECT id INTO target_org_id FROM organizations ORDER BY created_at ASC LIMIT 1; END IF; IF target_org_id IS NOT NULL THEN INSERT INTO organization_members (user_id, organization_id, created_by, updated_by, created_at, updated_at, role) VALUES (NEW.id, target_org_id, NEW.id, NEW.id, NOW(), NOW(), 'writer') ON CONFLICT (user_id, organization_id) DO NOTHING; END IF; RETURN NEW; END; \\\$\\\$ LANGUAGE plpgsql;
             DROP TRIGGER IF EXISTS trg_auto_join_organization ON users;
             CREATE TRIGGER trg_auto_join_organization AFTER INSERT ON users FOR EACH ROW EXECUTE FUNCTION auto_join_default_organization();
             \""
    restart: "no"
  azimutt:
    image: ghcr.io/azimuttapp/azimutt:main
    container_name: ejournal-azimutt
    volumes:
      - ./scripts/gfm-enhancer.js:/tmp/gfm-enhancer.js:ro
      - azimutt-uploads:/app/priv/static/uploads
      - azimutt-storage:/app/storage
    command: >
      sh -c "JS=/app/lib/azimutt-2.0.1781964598/priv/static/elm/script-8f7f5956bc8dda398697ff2d64397fa3.js; grep -q 'gfmV3' \"$$JS\" || (echo '' >> \"$$JS\" && echo ';' >> \"$$JS\" && cat /tmp/gfm-enhancer.js >> \"$$JS\" && rm -f \"$${JS}.gz\"); /app/bin/migrate && /app/bin/server"
    environment:
      PORT: ${AZIMUTT_PORT:-4000}
      PHX_HOST: ${AZIMUTT_HOST:-localhost}
      PHX_SERVER: "true"
      SECRET_KEY_BASE: ${AZIMUTT_SECRET_KEY_BASE:-9z6W7qVn3B8m1K4pL0xR2sY5tU8vW1zX4yA7bC0dE3fG6hI9jK2lM5nO8pQ1rS4t}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/azimutt_db?sslmode=disable
      FILE_STORAGE_ADAPTER: local
      AUTH_PASSWORD: "true"
      PUBLIC_SITE: "true"
      SKIP_ONBOARDING: "true"
      GATEWAY_URL: "http://localhost:4177"
    depends_on:
      postgres:
        condition: service_healthy
      init-azimutt-db:
        condition: service_completed_successfully
    restart: unless-stopped
  azimutt-gateway:
    image: node:20-alpine
    container_name: ejournal-azimutt-gateway
    working_dir: /app
    environment:
      NODE_PATH: "/usr/local/lib/node_modules"
    command: >
      sh -c "npm install -g @azimutt/gateway && node -e \"const g = require('/usr/local/lib/node_modules/@azimutt/gateway'); g.startServer(g.buildConfig({ NODE_ENV: 'production', LOG_LEVEL: 'info', API_HOST: '0.0.0.0', API_PORT: '4177', CORS_ALLOW_ORIGIN: '*' }));\""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  avataruploads:
  mail-data:
  mail-state:
  mail-config:
  prometheus-data:
  grafana-data:
  azimutt-uploads:
  azimutt-storage:
