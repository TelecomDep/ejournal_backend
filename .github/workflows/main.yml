name: E-Journal CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      skip_validate:
        description: 'Пропустить проверки (быстрый деплой)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================================================
  # ДЖОБА 1: БЫСТРАЯ ПРОВЕРКА (Frontend + Backend)
  # ==================================================
  validate:
    name: Validate Contracts & Tests
    if: |
      github.event.inputs.skip_validate != 'true' &&
      !contains(github.event.head_commit.message, '[skip validate]') &&
      !contains(github.event.head_commit.message, '[skip-validate]') &&
      !contains(github.event.head_commit.message, '[fast-deploy]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Быстрые Go Unit-тесты
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run Backend Unit Tests
        working-directory: backend
        run: go test -v ./...

      # 2. Проверка TypeScript + OpenAPI контрактов + Сборка фронтенда
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Contract Check (Frontend + Swagger)
        working-directory: frontend
        run: npm run check-api

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      # 3. Интеграционные тесты API (быстрый опрос готовности вместо sleep 15)
      - name: Start Backend Services
        env:
          JWT_SECRET: ci-only-ephemeral-database-signing-key-2026
          ALLOW_DEMO_ACCOUNTS: 'true'
          ALLOW_LEGACY_ROLE_REGISTRATION: 'true'
          ROLE_HASH_TEACHER: TEACHER-HASH-2026
          ROLE_HASH_STUDENT: STUDENT-HASH-2026
        run: docker compose up -d ejournal-backend

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8888/healthz > /dev/null 2>&1 || curl -sf http://localhost:8888/healthz > /dev/null 2>&1; then
              echo "API (/healthz) готово к работе!"
              exit 0
            fi
            echo "Ожидание API ($i/30)..."
            sleep 1
          done
          echo "API не ответило вовремя"
          docker compose logs ejournal-backend
          exit 1

      # Java уже предустановлена на раннере ubuntu-latest
      - name: Run Karate API Tests
        continue-on-error: true
        run: |
          chmod +x tests/run-tests.sh
          ./tests/run-tests.sh tests/

      - name: Stop Backend Services
        if: always()
        env:
          JWT_SECRET: ci-only-ephemeral-database-signing-key-2026
        run: docker compose down -v

  # ==========================================
  # ДЖОБА 2: ДЕПЛОЙ НА СЕРВЕР
  # ==========================================
  deploy:
    name: Deploy to Production
    needs: validate
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/sibsutis-ms/ejournal
            BACKUP_DIR="${DB_BACKUPS_DIR:-./backups}"
            mkdir -p "${BACKUP_DIR}"
            TIMESTAMP=$(date +'%Y%m%d_%H%M%S')
            
            # 1. Резервная копия БД до обновления
            docker compose exec -T postgres pg_dump -U postgres -d ejournal > "${BACKUP_DIR}/prev_${TIMESTAMP}.sql" 2>/dev/null || true
            chmod 600 "${BACKUP_DIR}/prev_${TIMESTAMP}.sql" 2>/dev/null || true
            
            # 2. Обновление кода и пересборка контейнеров
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            
            # 3. Проверка запуска сервисов
            sleep 3
            docker compose ps
            
            # 4. Резервная копия после успешного применения миграций
            docker compose exec -T postgres pg_dump -U postgres -d ejournal > "${BACKUP_DIR}/new_${TIMESTAMP}.sql" 2>/dev/null || true
            chmod 600 "${BACKUP_DIR}/new_${TIMESTAMP}.sql" 2>/dev/null || true
            
            # 5. Очистка старых дампов (>14 дней)
            find "${BACKUP_DIR}" -name "*.sql" -mtime +14 -delete 2>/dev/null || true

