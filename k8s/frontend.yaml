apiVersion: v1
kind: Service
metadata:
  name: sibsutis-front
  namespace: ejournal
spec:
  ports:
  - name: http
    port: 9999
    targetPort: 80
  - name: https
    port: 443
    targetPort: 443
  selector:
    app: sibsutis-front
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sibsutis-front
  namespace: ejournal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: sibsutis-front
  template:
    metadata:
      labels:
        app: sibsutis-front
    spec:
      containers:
      - name: frontend
        image: sibsutis-front:latest  # Replace with actual registry tag in CI/CD (e.g. registry.company.com/sibsutis-front:v1)
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        env:
        - name: DOMAIN
          valueFrom:
            configMapKeyRef:
              name: ejournal-config
              key: DOMAIN
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: ssl-certs
          mountPath: /etc/letsencrypt
        # Host certbot www challenge directory
        - name: certbot-www
          mountPath: /var/www/certbot
      volumes:
      - name: ssl-certs
        secret:
          secretName: ejournal-tls-secret
          items:
          # Note: In production, configure cert-manager to generate this secret, 
          # or populate lms.signal.qlabs.pro keys manually.
          - key: tls.crt
            path: live/lms.signal.qlabs.pro/fullchain.pem
          - key: tls.key
            path: live/lms.signal.qlabs.pro/privkey.pem
      - name: certbot-www
        emptyDir: {}
