apiVersion: 1

providers:
  - name: 'LMS System Dashboards'
    orgId: 1
    folder: 'LMS Monitoring'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: true
