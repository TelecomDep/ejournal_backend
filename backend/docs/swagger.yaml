info:
  contact: {}
  description: Backend API for e-journal, attendance links and invite registration.
  title: EJournal Backend API
  version: "1.0"
paths:
  /api/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Generates a password reset token and sends it to the user's email.
      parameters:
      - description: Forgot password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.ForgotPasswordData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Forgot password
      tags:
      - auth
  /api/auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets user password using the provided reset token.
      parameters:
      - description: Reset password payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.ResetPasswordData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Reset password
      tags:
      - auth
  /api/staff/overview:
    get:
      description: 'Returns groups, teachers and students scoped to the caller''s
        role: teacher -> own groups, head -> own lectern, dean -> own faculty, admin
        -> everything.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: Supervisory overview (teacher/head/dean/admin)
      tags:
      - staff
  /api/student/attendance/confirm:
    post:
      consumes:
      - application/json
      description: Student confirms attendance for active session.
      parameters:
      - description: Attendance confirm payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.AttendanceConfirmData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.studentAttendanceConfirmResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: Confirm attendance by invite token
      tags:
      - attendance
  /api/student/attendance/history:
    get:
      description: Returns attendance marks grouped by date for current student and
        selected year.
      parameters:
      - default: 2026
        description: History year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpserver.studentAttendanceHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: Get current student attendance history
      tags:
      - attendance
  /api/student/grades:
    post:
      consumes:
      - application/json
      description: Student gets own grade sheet for a subject.
      parameters:
      - description: Subject payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.GradeSubjectData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: Get current student grades by subject
      tags:
      - grades
  /api/student/grades/all:
    get:
      description: Returns every plan subject with its grade items and per-subject
        totals, plus an aggregate summary, in one request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app.Response'
      security:
      - BearerAuth: []
      summary: Get all grades for the current student
      tags:
      - grades
  /api/student/mark-attendance:
    post:
      consumes:
      - application/json
      description: Student marks attendance with lesson ID, device ID, and current
        location.
      parameters:
      - description: Android attendance payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/app.AndroidAttendanceMarkData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
