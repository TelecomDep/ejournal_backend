info:
  contact: {}
  description: Backend API for e-journal, attendance links and invite registration.
  title: EJournal Backend API
  version: "1.0"
paths:
  /api/student/attendance/confirm:
    post:
      consumes:
      - application/json
      description: Student confirms attendance for active session.
      parameters:
      - description: Attendance confirm payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.AttendanceConfirmData'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver.studentAttendanceConfirmResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
      security:
      - BearerAuth: []
      summary: Confirm attendance by invite token
      tags:
      - attendance
  /api/student/attendance/history:
    get:
      description: Returns attendance marks grouped by date for current student and
        selected year.
      parameters:
      - default: 2026
        description: History year
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_httpserver.studentAttendanceHistoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
      security:
      - BearerAuth: []
      summary: Get current student attendance history
      tags:
      - attendance
  /api/student/grades:
    post:
      consumes:
      - application/json
      description: Student gets own grade sheet for a subject.
      parameters:
      - description: Subject payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.GradeSubjectData'
