        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_TelecomDep_ejournal_backend_internal_app.Response'
        "500":
